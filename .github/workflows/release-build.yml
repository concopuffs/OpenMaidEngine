name: Release builds

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine ships as one NativeAOT library (docs/platform-portability.md, "Fewer files in a package"). NativeAOT
  # compiles for its own system only, so each library is built on its own system, and the package jobs below take it
  # from here.
  linux-engine:
    name: Linux x64 engine library
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The library needs the glibc it is linked on, so it is linked on the package's floor, 2.28, in the image the
    # FFmpeg SDK is built in (ffmpeg-sdk.yml). The Linux packager refuses a library that needs a newer one.
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.03-1@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_XMLDOC_MODE: skip
      PYTHONUTF8: "1"
      # The SDK's own tools need no culture data, so the image needs no ICU.
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - name: Install build tools
        # git before the checkout, so the checkout is a repository whose commit the publish stamps.
        run: |
          dnf install -y git
          echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Report toolchain
        run: |
          python3 --version
          dotnet --version
          gcc --version | head -n 1
          ldd --version | head -n 1

      - name: Publish the engine library
        run: |
          python3 -X utf8 tools/opcodes_build.py --build
          python3 -X utf8 tools/publish_engine.py --runtime linux-x64

      - name: Upload the engine library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-linux-x64-${{ github.sha }}
          path: build/engine-publish/
          if-no-files-found: error
          retention-days: 7

  windows-engine:
    name: Windows x64 engine library
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_XMLDOC_MODE: skip
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep the repository's line endings
        # The library embeds text files, the base mods among them; checked out as stored, with LF, it embeds the bytes
        # the Linux library does.
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Report toolchain
        # NativeAOT links with the MSVC tools, which it finds through vswhere.
        run: |
          python --version
          dotnet --version
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' \
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property displayName

      - name: Publish the engine library
        run: |
          python -X utf8 tools/opcodes_build.py --build
          python -X utf8 tools/publish_engine.py --runtime win-x64

      - name: Upload the engine library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-win-x64-${{ github.sha }}
          path: build/engine-publish/
          if-no-files-found: error
          retention-days: 7

  linux-release:
    name: Linux x64 artifact
    needs: linux-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_XMLDOC_MODE: skip
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the engine library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-linux-x64-${{ github.sha }}
          path: build/engine-publish

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # global.json's SDK builds every project (all net10.0), and its runtime runs their tests.
          global-json-file: global.json

      - name: Restore immutable Linux inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/downloads/Godot_*_mono_linux_x86_64.zip
            build/downloads/ome-ffmpeg-*-linux-x64-lgpl-shared.tar.xz
            build/toolchains/godot-*/xdg-data/godot/export_templates/*/linux_release.x86_64
          key: linux-release-inputs-${{ hashFiles('tools/godot-linux-x64.json', 'native/ome_movie_ffmpeg/dependency-linux-x64.json') }}

      - name: Report toolchain
        run: |
          python --version
          dotnet --version
          cc --version
          readelf --version
          free -h
          if [ -r /sys/fs/cgroup/memory.max ]; then
            echo "cgroup memory.max=$(cat /sys/fs/cgroup/memory.max)"
            echo "cgroup memory.current=$(cat /sys/fs/cgroup/memory.current)"
          fi

      - name: Build and smoke-test Linux package
        run: ./tools/build-linux-x64.sh

      - name: Stage verified workflow artifact
        run: |
          mkdir -p build/workflow-artifact
          cp build/package/OME-linux-x64.tar.gz build/workflow-artifact/
          cp build/package/staging/OME-linux-x64/BUILD-INFO.json build/workflow-artifact/
          cp build/package/staging/OME-linux-x64/SHA256SUMS build/workflow-artifact/
          cp build/package/package-smoke.log build/workflow-artifact/
          cd build/workflow-artifact
          sha256sum OME-linux-x64.tar.gz > OME-linux-x64.tar.gz.sha256

      - name: Upload verified Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OME-linux-x64-${{ github.sha }}
          path: build/workflow-artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/package/package-smoke.log
            build/games/*/validation/**
          if-no-files-found: ignore
          retention-days: 7

  windows-release:
    name: Windows x64 artifact
    needs: windows-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_XMLDOC_MODE: skip
      PYTHONUTF8: "1"
      MINGW_CC: x86_64-w64-mingw32-gcc-posix
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the engine library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-win-x64-${{ github.sha }}
          path: build/engine-publish

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # global.json's SDK builds every project (all net10.0), and its runtime runs their tests.
          global-json-file: global.json

      - name: Install MinGW cross-toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Restore immutable Windows inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/downloads/Godot_*_mono_linux_x86_64.zip
            build/downloads/ome-ffmpeg-*-win64-lgpl-shared.zip
            build/toolchains/godot-*/xdg-data/godot/export_templates/*/windows_release_x86_64.exe
          key: windows-release-inputs-${{ hashFiles('tools/godot-linux-x64.json', 'native/ome_movie_ffmpeg/dependency-win64.json') }}

      - name: Report toolchain
        run: |
          python --version
          dotnet --version
          "$MINGW_CC" --version
          x86_64-w64-mingw32-objdump --version
          free -h
          if [ -r /sys/fs/cgroup/memory.max ]; then
            echo "cgroup memory.max=$(cat /sys/fs/cgroup/memory.max)"
            echo "cgroup memory.current=$(cat /sys/fs/cgroup/memory.current)"
          fi

      - name: Cross-build and verify Windows package
        run: ./tools/build-windows-x64.sh

      - name: Stage verified workflow artifact
        run: |
          mkdir -p build/workflow-artifact-windows
          cp build/package/windows-x64/OME-windows-x64.zip build/workflow-artifact-windows/
          cp build/package/windows-x64/staging/OME-windows-x64/BUILD-INFO.json build/workflow-artifact-windows/
          cp build/package/windows-x64/staging/OME-windows-x64/SHA256SUMS build/workflow-artifact-windows/
          cp build/package/windows-x64/staging/OME-windows-x64/WINDOWS-VERIFICATION.json build/workflow-artifact-windows/
          cd build/workflow-artifact-windows
          sha256sum OME-windows-x64.zip > OME-windows-x64.zip.sha256

      - name: Upload verified Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OME-windows-x64-${{ github.sha }}
          path: build/workflow-artifact-windows/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native/win-x64/verification.json
            build/native/win-x64/ome_movie_ffmpeg.map
            build/package/windows-x64/staging/OME-windows-x64/WINDOWS-VERIFICATION.json
            build/games/*/validation/**
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-release
      - windows-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Releases are part of contents on GitHub; only this tag-gated job can write.
      contents: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          architecture: x64

      - name: Download verified Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OME-linux-x64-${{ github.sha }}
          path: build/release-assets/linux

      - name: Download verified Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OME-windows-x64-${{ github.sha }}
          path: build/release-assets/windows

      - name: Create or resume GitHub release
        # Context values reach the script as environment variables, never as text spliced into it.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          python -X utf8 tools/publish_github_release.py \
            --repository "$RELEASE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --target "$RELEASE_TARGET" \
            --linux-artifact-directory build/release-assets/linux \
            --windows-artifact-directory build/release-assets/windows \
            --output-directory build/release-assets/prepared

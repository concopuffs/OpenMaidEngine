# The boot's data (Lua scripting spec §9.2). Hand-written: each event names its point and gives each field's cell, by the
# names layout/globals.json exports.

[[event]]
name = "arterial.data.layered"
point = "arterial.boot.data_layered"
description = """
At boot, once every layer has written its data tables (the base layer's, then each append's) and before the boot uses \
them. An edit made here lands where an append's edit lands, and the boot's own work then runs over it as it runs over \
the appends'. A handler that edits a table (a card, a character, an item, a battle) changes it until the tables are \
built again. The tables are not saved: a load builds them again and raises this again while it restores \
(maid.session.restoring is true), so the handler makes its edit again. The data files of arterial.tables are applied \
here, among this event's handlers in the mods' load order, so a handler here takes its place among them."""

[[event]]
name = "arterial.data.ready"
point = "arterial.boot.data_ready"
description = """
At boot, once every data table is built and the boot's own work on them is done: INIT2 has filled the unset text \
colours, indexed the faces, walked the saved decks, counted the party's skills, and set the area up again for a save \
made on a map. An edit made here comes after that work, which does not see it: arterial.data.layered comes before it. \
A handler here runs after every data file of arterial.tables, whatever the load order, because this event comes later \
in the boot; one that should take its place among them by load order subscribes to arterial.data.layered instead. \
The tables are not saved: a load builds them again and raises this again while it restores (maid.session.restoring \
is true), so the handler makes its edit again."""

# The boot's data (Lua scripting spec §9.2). Hand-written: each event names its point and gives each field's cell, by the
# names layout/globals.json exports.

[[event]]
name = "kamidori.data.layered"
point = "kamidori.boot.data_layered"
description = """
At boot, once every layer has written its data tables (the base layer's, then each append's) and before the boot uses \
them. An edit made here lands where an append's edit lands, and the boot's own work then runs over it as it runs over \
the appends'. A handler that edits a table (a unit's stats, an item, a skill) changes it until the tables are built \
again. The tables are not saved: a load builds them again and raises this again while it restores \
(maid.session.restoring is true), so the handler makes its edit again."""

[[event]]
name = "kamidori.data.ready"
point = "kamidori.boot.data_ready"
description = """
At boot, once every data table is built and the boot's own work on them is done: INIT2 has filled the unset text \
colours, rebuilt the field for a save made on a floor and set up the studio's ornaments. An edit made here comes \
after that work, which does not see it: kamidori.data.layered comes before it. The tables are not saved: a load \
builds them again and raises this again while it restores (maid.session.restoring is true), so the handler makes its \
edit again."""

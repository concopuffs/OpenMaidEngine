omp = 4
id = "himegari-base"
name = "姫狩りダンジョンマイスター base"
version = "1.1.0"
description = "Names the game's cells for Lua mods (the layout the engine builds a mod's game.g and game.table from), and gives helpers that change the game through its own scripts."

[game]
profile = "himegari"
target = "extended"

[lua]
api = 1
capabilities = ["vm"]
# The game scripts the helpers in lua/init.lua call (spec §10); omp check walks each.
calls = ["ADDITEM"]

# The library tables.lua applies the record tables with (data patches spec §6.4); the engine ships it too.
[[requires]]
id = "ome-records"
version = ">=1, <2"

# Data files of the game's record tables (data patches spec §6): a mod that requires this base mod ships them under
# data/, and tables.lua checks and applies each, by the record map lua/generated/tables.lua: the boot's tables at
# himegari.data.layered, and a stage's part each time its loaders have run. The link checks each file against
# shapes/tables.schema.json first, which base_mod_build.py generates from the same record map (spec §7).
[[accepts]]
kind = "himegari.tables"
description = "Edits to the game's record tables: units, items and skills, which the boot builds, and each stage's enemies, which its loader writes."
shape = "tables.schema.json"

[[accepts.at]]
event = "himegari.data.layered"
handler = "tables.lua:apply_boot"

[[accepts.at]]
event = "himegari.stage.loaded"
handler = "tables.lua:apply_stage"

# ---------------------------------------------------------------------------------------------- tables
# Open Maid Script tables (design spec §5.3): record views over the parallel arrays above. A field names a
# global by name; its leading dimension must be the record count. Generated into globals.json `tables`.

[[table]]
name = "unit"
records = 1000
usage = "EBINIT unit records keyed by unit id, with the per-unit runtime arrays (history face, voice family and setting slot). `unit[761].stats.max_hp` is `unit_base_stats[761].max_hp`."

[table.fields]
speaker_name = "unit_speaker_names"
full_name = "unit_full_names"
display_name = "unit_display_names"
initial_class_title = "unit_initial_class_titles"
bestiary_description = "unit_bestiary_description_lines"
history_face_asset_id = "unit_history_face_asset_ids"
voice_family_unit_id = "unit_voice_family_unit_ids"
voice_setting_slot = "unit_voice_setting_slot"
voice = "unit_voice_asset_ids"
graphic = "unit_graphic_asset_ids"
sort_key = "unit_sort_key"
bestiary_listed = "unit_bestiary_listed"
race = "unit_race"
sex = "unit_sex"
boss_class = "unit_boss_class"
canonical_character_id = "unit_canonical_character_id"
cutin_element = "unit_cutin_element"
element_resistance = "unit_element_resistance_levels"
default_attack_item_id = "unit_default_attack_item_id"
initial_weapon_level = "unit_initial_weapon_level"
equippable_category_mask = "unit_equippable_category_mask"
initial_equipment = "unit_initial_equipment_item_ids"
default_costume_item_id = "unit_default_costume_item_id"
skill = "unit_skill_ids"
initial_party_capacity = "unit_initial_party_capacity"
unused_0x2bd024 = "unit_unused_0x2bd024"
party_cost = "unit_party_cost"
initial_affinity_tenths = "unit_initial_affinity_tenths"
starting_level = "unit_starting_level"
level_cap = "unit_level_cap"
auto_level_scale_divisor = "unit_auto_level_scale_divisor"
experience_level_cap = "unit_experience_level_cap"
stats = "unit_base_stats"
stat_growth = "unit_stat_growth_rates"
initial_stat_caps = "unit_initial_stat_caps"
experience_reward = "unit_experience_reward"
bestiary_knowledge_gain = "unit_bestiary_knowledge_gain"
drop_item = "unit_drop_item_ids"

# Named patch points for Kamidori (mod loader spec §5: docs/superpowers/specs/2026-11-03-mod-loader-design.md).
#
# A point gives fragments a stable site name: `before site kamidori.experience.after_calculation { ... }`.
# Each [[point.at]] entry is one revision of the script: the SHA-256 of its bytes as the catalog serves them
# (`Ome.Cli oms-patch --fingerprint NAME.BIN --game kamidori`) and the original dword offset of the instruction the
# point names. The point's description says what holds when control reaches that instruction.
#
# Source data. Run `py -3.11 -X utf8 tools/patch_points_build.py --game kamidori --build` after editing; it
# validates every entry against the installed base and generates build/games/kamidori/patch-points.json and
# docs/patch-point-reference-kamidori.md.

[[point]]
name = "kamidori.experience.after_calculation"
script = "ADDEXP.BIN"
description = """
The award is final and not yet applied. L[0x1] holds the experience the character receives: G[0xfec0c], the amount \
the caller passes (COMMITBTL after a battle, FIELD), times the costume bonus (100, plus 25 for each of the four \
item_costume_gem_sockets of character_costume_item_id[current_character_id] that holds 0x118), over 100. \
current_unit_id is the unit and current_character_id its canonical character, whose character_levels, \
character_experience and unit_level_cap the award reads. Every path reaches this instruction, so `before site` sees \
every award and may rewrite L[0x1]; an amount of 0 or less, or a character at its level cap, gains no experience. \
Weapon experience (G[0xfec0d] and the equipped item) is decided after this point and does not read L[0x1]."""

[[point.at]]                    # the untranslated install (Kamidori/, with its official updates)
fingerprint = "sha256:606b83e952a3ce45ee406a2383710734f1ea707288f5751b5614be50e3edd7b6"
site = 0x88

[[point.at]]                    # the translated install's patch/ADDEXP.BIN: the same code, two strings translated
fingerprint = "sha256:23bb6ac1e1aa83ef248bbacba4cadd71801fa07188aed3938c4768034f52b40b"
site = 0x88

[[point]]
name = "kamidori.boot.data_layered"
script = "INIT2.BIN"
description = """
The instruction after op 0x143 (INIT2@0x20c). Every layer has written its data: the 28 base *INIT scripts, then each \
mounted append's $n$AUTORUN and its $n$*INIT layers. The boot has not used the tables yet. INIT2 goes on to fill \
each unset text colour setting from voice_setting_default_text_colors, to rebuild the field when a save made on a \
floor is loaded (G[0x428c]: the stage loaders, then SETMAPTEX, whose READICON reads unit_graphic_asset_ids and \
item_costume_graphic_asset_ids), and to set up the studio's ornaments. None of it writes a record table, so that \
work reads an edit made here. The tables lie above the saved prefix (0xfd40f): a load zeroes them, the prologue \
builds them again, and control reaches here again while the load restores."""

[[point.at]]                    # the untranslated install
fingerprint = "sha256:5e4932184f30e6d35d9ee9b259f2987bd62e443479fa2d207fde2edfbac5a65d"
site = 0x20d

[[point.at]]                    # the translated install's patch/INIT2.bin: the same code, its strings translated
fingerprint = "sha256:a60b27687b52d51c06ecfb1371e3aea7393b45a21612bb3715992ef2970925f8"
site = 0x20d

[[point]]
name = "kamidori.boot.data_ready"
script = "INIT2.BIN"
description = """
INIT2's exit. Every data table is built: the 28 base *INIT scripts, each mounted append's $n$AUTORUN and its \
$n$*INIT layers (op 0x143), and INIT2's own work after them, which reads the tables (kamidori.boot.data_layered). An \
edit made here comes after that work. The tables lie above the saved prefix (0xfd40f): a load zeroes them, the \
prologue builds them again, and control reaches here again while the load restores."""

[[point.at]]                    # the untranslated install
fingerprint = "sha256:5e4932184f30e6d35d9ee9b259f2987bd62e443479fa2d207fde2edfbac5a65d"
site = 0x2cf

[[point.at]]                    # the translated install's patch/INIT2.bin: the same code, its strings translated
fingerprint = "sha256:a60b27687b52d51c06ecfb1371e3aea7393b45a21612bb3715992ef2970925f8"
site = 0x2cf

[[point]]
name = "kamidori.stage.after_loader"
script = "FIELD.BIN"
description = """
Every layer's map and stage loader has run (mpinit_layer_script_ids and stage_loader_script_ids: MPINIT and STINIT, \
then each append's) and FIELD has placed nothing yet: the floor's enemy slots, objects and rules hold the stage as \
authored. current_stage_id is the stage."""

[[point.at]]
fingerprint = "sha256:e350246cc923622b92342a9377a75f597623c09c2b78b423d90fe067cde35f21"
site = 0x527

[[point.at]]
fingerprint = "sha256:0c93c6815a7b6903564000ff470d4c5854b5baac4c994cddcda81899e25cbfd4"
site = 0x527

[[point]]
name = "kamidori.stage.after_info_reload"
script = "INFO3.BIN"
description = """
INFO's third tab (INFO3, which FIELD opens from its menu) has run every stage's loaders for its list of enemies \
(INFO3@0xb88 to 0xc12), and then, on a floor (G[0x428c] set), put current_stage_id back and run that stage's \
loaders again (INFO3@0xcdc to 0xd1a): the floor's enemy slots, objects and rules hold the stage as authored, and the \
units on the field are where they were. Off a floor control does not reach here. current_stage_id is the floor's \
stage."""

[[point.at]]                    # both installs: the translated install's patch/INFO3.BIN is the same bytes
fingerprint = "sha256:3b5e1175ed376da324d2a0e9080cd9831f549f6ec2cfe99a241e8043518d6bc5"
site = 0xd20


details = "This is the ordinary-page redraw sibling of 0x1d1's reflowed History renderer. It preserves each retained record's saved position/style, stops at the next group boundary, and replaces the selected layout's glyph objects. Flag bit 0 crosses navigation-filtered records, bit 1 temporarily overrides both colors, bit 2 suppresses destination binding, and bit 3 replays retained voice records. All six Kamidori calls are CONFIG return paths: 0x83 supplies layout_slot/record_index, flags is 2, text_color is white, and effect_color is the configured global. The portable retained-text presentation preserves the selected group/layout and shipped color-override path; it uses the existing host text batch abstraction rather than native per-glyph GDI records."
noop_headless = false
source = "investigation"
confidence = "high"
depends_on = []
evidence = [

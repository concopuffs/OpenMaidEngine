# vm-map/globals-arterial.toml -- CANONICAL living global-variable registry for Arterial
# (創刻のアテリアル, SYS4438; hand-edited). Global addresses are per game, so this is separate from the
# other games' registries; the schema is identical (the type implies the bank: `string...` entries are
# string-bank cells, everything else integer cells).
# Generated artifacts (build/games/arterial/globals.json, docs/global-reference-arterial.md) come from
# this file via `tools/globals_build.py --game arterial --build`. Do not edit those.
# Layouts and evidence: docs/arterial-data-tables.md. Only what is understood has a name here: every array
# of the boot tables with a reading in that document, save the few whose reading names no use, and the
# saved cells the tables are read through.
[meta]
note = "Curated Arterial global addresses. Names started 2026-11-20 from the table layouts of tools/init_arterial.py and the scripts that read them."


# ---- ADV page state (oms/arterial/adv.oms) ----

[[global]]
address = "0x3140"
name = "adv_speaker_character_id"
category = "index-pointer"
type = "int"
usage = "The page's speaker: a character id, or -1 for narration. set_page_face sets it from the page's face; draw_nameplate and the page's voice block read it."
source = "investigation"
confidence = "high"

[[global]]
address = "0x3141"
name = "adv_page_has_text"
category = "ui-toggle"
type = "int"
usage = "1 once a page has text: every dialogue page sets it first, clear_message_text clears it, and publish_message_text publishes the layout only while it is set."
source = "investigation"
confidence = "high"

[[global]]
address = "0x3143"
name = "adv_name_form"
category = "index-pointer"
type = "int"
usage = "Which column of character_names the name plate shows (0 to 5); any other value shows ？？？？ (draw_speaker_name)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x3fb90"
name = "adv_face_id"
category = "index-pointer"
type = "int"
usage = "A page's face id before set_page_face (a row of CFINIT); other library subs pass a picture id in the same cell."
source = "investigation"
confidence = "med"

[[global]]
address = "0x3fb91"
name = "adv_voice_id"
category = "index-pointer"
type = "int"
usage = "The page's voice clip: the page's voice block sets it, clears it when the speaker's voice setting mutes it, and plays it."
source = "investigation"
confidence = "high"



# ---- Scopes (data patches spec §6.2): a scope of the game that keys some of its record tables ----

[[scope]]
name = "area"
first = 1
last = 299
usage = "An area, by current_area_id (an id of AMINIT; the game's are 1 to 197 and its per-area arrays hold 300). MPINIT, ROINIT and UNINIT clear these tables and fill them from the branch for the area in play."


# Named patch points for Arterial (mod loader spec §5: docs/superpowers/specs/2026-11-03-mod-loader-design.md).
#
# A point gives fragments a stable site name: `before site arterial.experience.after_calculation { ... }`.
# Each [[point.at]] entry is one revision of the script: the SHA-256 of its bytes as the catalog serves them
# (`Ome.Cli oms-patch --fingerprint NAME.BIN --game arterial`) and the original dword offset of the instruction the
# point names. The point's description says what holds when control reaches that instruction.
#
# Source data. Run `py -3.11 -X utf8 tools/patch_points_build.py --game arterial --build` after editing; it
# validates every entry against the installed base and generates build/games/arterial/patch-points.json and
# docs/patch-point-reference-arterial.md.
#
# Where the appends hook (each a slot array INIT2 sets for the base scripts, slot 0, and each $n$AUTORUN for its own,
# slot n; docs/arterial-data-tables.md): MPINIT, ROINIT and UNINIT (SETMAPDATA, the area's tables), READY and OPEN
# (ALLMAP, an area's set-up and its opening), SCJUMP's chain (ALLMAP and BTL, the scene dispatch), BGINIT (the
# scenes' pictures), TUMES, the item actions (SELITEM), the 奥義 and the talents (the battle phases). The points
# below sit after the chains a mod's data or a mod's rules follow.

[[point]]
name = "arterial.boot.data_layered"
script = "INIT2.BIN"
description = """
The instruction after op 0x143 (INIT2@0x17e). Every layer has written its data: the 29 base *INIT scripts, INIT2's \
slot 0 of each append chain (the base scripts' ids) and its constants, then each mounted append's $n$AUTORUN, which \
runs its $n$*INIT layers and sets its slot n of each chain. The boot has not used the tables yet. INIT2 goes on to \
fill each unset text colour setting (G[0x36ed]) from voice_setting_text_colors, to index the faces \
(face_character_ids and face_slots, from character.face_id), to walk the cards of the six saved decks \
(G[0x9581] on), to run COUNTSKILL, and, when a save made on an area's map is loaded (G[0x36ca]), to set the area up \
again (SETMAPDATA, then SETMAPTEX, SETMAPANIME, DRAWMAP and DRAWOBJ). That work reads an edit made here. The tables \
lie above the saved prefix (0x3fb81): a load zeroes them, the prologue (SYSTEM4) builds them again, and control \
reaches here again while the load restores."""

[[point.at]]                    # the install the guide lists (games/arterial, four appends)
fingerprint = "sha256:ffe0c8022233ec9bad8981799fd66003f9f01cbb48ee1a11f95e44a92dbaf778"
site = 0x17f

[[point]]
name = "arterial.boot.data_ready"
script = "INIT2.BIN"
description = """
INIT2's exit. Every data table is built: the 29 base *INIT scripts, each mounted append's $n$AUTORUN and its \
$n$*INIT layers (op 0x143), and INIT2's own work after them, which reads the tables (arterial.boot.data_layered); \
for a save made on an area's map that work has set the area up again. An edit made here comes after that work. The \
tables lie above the saved prefix (0x3fb81): a load zeroes them, the prologue (SYSTEM4) builds them again, and \
control reaches here again while the load restores."""

[[point.at]]                    # the install the guide lists
fingerprint = "sha256:ffe0c8022233ec9bad8981799fd66003f9f01cbb48ee1a11f95e44a92dbaf778"
site = 0x3a4

[[point]]
name = "arterial.area.after_loaders"
script = "SETMAPDATA.BIN"
description = """
SETMAPDATA's exit. The loaders of the area in play (current_area_id) have run, each layer's in its turn: for each \
slot from 0 (the base) to 31 ($n$ for append n), MPINIT (the points, area_point), ROINIT (the routes, area_route) \
and UNINIT (the units, area_unit), each of which clears its arrays before it fills them. After them SETMAPDATA has \
given area_unit[1], the player's unit, the pictures of map_agent_character_id, or of party_leader_id when no agent \
is set. ALLMAP runs SETMAPDATA when it sets an area up, before the READY chain; BTL runs it after a battle whose \
next scene is played on a map (G[0x36ca]), and INIT2 when a save made on a map is loaded. The tables are written \
afresh each time."""

[[point.at]]                    # the install the guide lists
fingerprint = "sha256:513217fe2b878e32ff17617255303b4c2982b2a2bd91b955a68204469c037d2d"
site = 0xc1

[[point]]
name = "arterial.area.after_ready_handlers"
script = "READYEND.BIN"
description = """
READYEND's first instruction. ALLMAP calls READYEND only right after it walks the READY chain, every layer's READY \
handler (ready_open_script_ids[slot].ready, slot 0 the base READY and slot n $n$READY), and before SETFATE: when it \
sets an area up (unless G[0x9882] is 2) and in three places of its map loop, so control reaches here more than \
once in an area. The READY handlers set story cells (scene played cells) from the progress; READYEND sets a few \
more, then SETFATE counts the open goals."""

[[point.at]]                    # the install the guide lists
fingerprint = "sha256:d206ff4c8da127fcb7d0c07bb82205abe80aebf176e2ada1c34e3e53c39b8bc8"
site = 0x0

[[point]]
name = "arterial.battle.before_phases"
script = "BTL.BIN"
description = """
BTL's call of PHASECONTROLLER, which plays the battle out. SETREGULATION has taken the battle's rule \
(battle_rule_id), SETBTSKILL its skills and DECKBUILD the decks, and the battle's music plays. battle_id is the \
battle (a DUINIT id) and current_opponent_id the arena opponent (0 outside the arena). \
battle_result is 0. BTL reaches here at each try: a lost battle that the player fights again (リトライ) comes back \
through DECKBUILD to here."""

[[point.at]]                    # the install the guide lists
fingerprint = "sha256:67fe6c6f4b8e2996b854b1acb856451b139b19dc3b16a982eef2d4d3a375ae08"
site = 0x51e

[[point]]
name = "arterial.battle.after_phases"
script = "BTL.BIN"
description = """
The instruction after BTL's call of PHASECONTROLLER. The battle is decided and nothing of its outcome is applied: \
battle_result is 1 for a win and 2 for a loss, and G[0x4687aa] is 0x300 or more when the party withdrew or fled. \
BTL then shows the outcome, runs RESULT on a win (the rewards and the experience, \
arterial.experience.after_calculation), and offers a loss outside the arena again unless the party fled; after \
the last try it marks a beaten opponent and plays the battle's scene for its result."""

[[point.at]]                    # the install the guide lists
fingerprint = "sha256:67fe6c6f4b8e2996b854b1acb856451b139b19dc3b16a982eef2d4d3a375ae08"
site = 0x521

[[point]]
name = "arterial.experience.after_calculation"
script = "RESULT.BIN"
description = """
One party character's award is final and not yet applied: the add of party_member_experience[character_arg_id] \
and the award. Its third operand (arg[3], a pointer into RESULT's array at L[0xf4bb]) holds the experience the \
character receives: the battle's award (L[0xf4b1]), half as much again for party_leader_id and \
party_ultimate_character_id, plus the experience skills' bonus (L[0xf4b2]) and one for each of the battle's cards \
of the character's rows. RESULT reaches here on a won battle once for each party character whose level is 1 or more \
and below the cap (9, or 35 once G[0x36d1] is set); a `before site` may rewrite the operand. The level-ups after \
this instruction read the new experience, and the card experience was given before it."""

[[point.at]]                    # the install the guide lists
fingerprint = "sha256:41748fa07bc1cae951582ce52d419d8a5b3dd9dbe8962b81c3798487662937ec"
site = 0xb00

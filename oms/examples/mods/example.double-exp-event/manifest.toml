omp = 3
id = "example.double-exp-event"
name = "Double EXP (event)"
version = "1.0.0"
description = "Doubles every experience award, from a Lua subscriber of the base mod's experience award event."

[game]
profile = "himegari"
target = "extended"

[lua]
api = 1

[[requires]]
id = "himegari-base"
version = ">=1.0, <2"

[[hooks]]
event = "himegari.experience.award"
handler = "double_exp.lua:on_award"
